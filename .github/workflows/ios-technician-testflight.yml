name: iOS Technician TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "MingZhu-Technician-IOS/**"
      - ".github/workflows/ios-technician-testflight.yml"

permissions:
  contents: read

concurrency:
  group: ios-technician-release
  cancel-in-progress: false

env:
  IOS_PROJECT_DIR: MingZhu-Technician-IOS
  SCHEME: MingZhuTechnician
  BUNDLE_ID: com.taimingzhu.ymz
  TEAM_ID: 4N529765U3
  PROFILE_NAME: MingZhu DaoJia AppStore
  MARKETING_VERSION: 1.0.1

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app
          xcodebuild -version

      - name: Prepare build metadata
        run: |
          set -euo pipefail
          echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 1000))" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import signing files
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          set -euo pipefail
          require_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "::error::$name is empty or missing. Add it in Settings -> Secrets and variables -> Actions."
              exit 1
            fi
          }
          require_secret "IOS_P12_BASE64" "$IOS_P12_BASE64"
          require_secret "IOS_P12_PASSWORD" "$IOS_P12_PASSWORD"
          require_secret "IOS_MOBILEPROVISION_BASE64" "$IOS_MOBILEPROVISION_BASE64"

          mkdir -p "$RUNNER_TEMP/signing"
          decode_base64() {
            local value="$1"
            local output="$2"
            printf '%s' "$value" | base64 --decode > "$output" 2>/dev/null || printf '%s' "$value" | base64 -D > "$output"
          }
          decode_base64 "$IOS_P12_BASE64" "$RUNNER_TEMP/signing/cert.p12"
          decode_base64 "$IOS_MOBILEPROVISION_BASE64" "$RUNNER_TEMP/signing/profile.mobileprovision"

          if ! security cms -D -i "$RUNNER_TEMP/signing/profile.mobileprovision" > "$RUNNER_TEMP/signing/profile.plist"; then
            echo "::error::IOS_MOBILEPROVISION_BASE64 is not a valid mobileprovision file. Copy the full content of D:\\Codex\\ios-certs\\com.taimingzhu.ymz\\github-secrets\\IOS_MOBILEPROVISION_BASE64.txt, not the file path."
            exit 1
          fi
          if ! openssl pkcs12 -in "$RUNNER_TEMP/signing/cert.p12" -nokeys -passin "pass:$IOS_P12_PASSWORD" -info -noout >/dev/null 2>&1; then
            echo "::error::IOS_P12_BASE64 or IOS_P12_PASSWORD is invalid. Copy the full content of IOS_P12_BASE64.txt and IOS_P12_PASSWORD.txt."
            exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing/cert.p12" -k "$KEYCHAIN" -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/signing/profile.plist")
          cp "$RUNNER_TEMP/signing/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      - name: Generate Xcode project
        working-directory: ${{ env.IOS_PROJECT_DIR }}
        run: xcodegen generate

      - name: Archive
        working-directory: ${{ env.IOS_PROJECT_DIR }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$SCHEME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/$SCHEME.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Create export options
        working-directory: ${{ env.IOS_PROJECT_DIR }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        working-directory: ${{ env.IOS_PROJECT_DIR }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/$SCHEME.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist "$PWD/ExportOptions.plist"

          cat > "$PWD/build/export/build-info.txt" <<EOF
          App: 贝尼技师端
          Version: $MARKETING_VERSION
          Build: $BUILD_NUMBER
          Bundle ID: $BUNDLE_ID
          Source: https://daojia.beinikj.com/technician/home
          Commit: $GITHUB_SHA
          EOF

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: beini-technician-ios-ipa-${{ github.run_number }}
          path: |
            ${{ env.IOS_PROJECT_DIR }}/build/export/*.ipa
            ${{ env.IOS_PROJECT_DIR }}/build/export/build-info.txt
          if-no-files-found: error
          retention-days: 14

